# BigBrother camera config.
# Copy to config/cameras.yml and edit. Passwords never go here: reference
# variables from .env as ${NAME}. After editing, run:
#   docker compose run --rm tools configure

# Object detection model and the hardware it runs on.
detector:
  model: yolox_s          # yolox_tiny | yolox_s (default) | yolox_m, or a path to an .onnx
  backend: openvino       # openvino (Intel CPU) | onnxruntime (cpu, or cuda/tensorrt with a GPU)
  # device: CPU           # backend default if omitted
  # threads: 0            # threads per inference, 0 = automatic
  # workers: 0            # parallel inferences, 0 = automatic (1 per 8 CPUs)
  # input_size: [640, 384] # model input (width, height); 16:9 avoids padding. "native" = 640x640

# Alerts: what gets sent to your phone (Pushover keys go in .env).
alerts:
  enabled: true
  notifier: pushover       # pushover | log (log = record only, don't send)
  timezone: America/New_York
  verify: true             # second opinion with a bigger model on the full-res frame
  verify_model: yolox_m
  verify_threshold: 0.5
  # public_url: https://nvr.example.com   # adds a "View clip" link that opens the event in the app
  group_seconds: 90        # one alert per visit: same object on another camera within this (0 = off)
  # arm_schedule:          # turn alerts on at each start and off at each end (the lamp still works between)
  #   - {days: [mon, tue, wed, thu, fri], start: "09:00", end: "17:00"}
  #   - {start: "22:00", end: "07:00"}
  health:                  # alerts when the NVR itself has a problem (sent even when disarmed)
    enabled: true
    after_minutes: 5       # how long a problem must last before it's reported
  pushover:
    priority: 0            # -2 silent ... 1 high (bypasses quiet hours)
    sound: ""              # "" = your Pushover default

# Defaults applied to every camera (each camera can override).
defaults:
  record:
    enabled: true
    audio: false          # true = record audio (G.711 is converted to AAC)
    segment_seconds: 60   # length of each recording file
  detect:
    enabled: true
    fps: 5                # frames analysed per second (from the substream)
    # live_fps: 15        # debug viewer preview rate (costs CPU); app live view uses go2rtc
    labels: [person, car, truck, bus, motorcycle, bicycle, dog, cat]
    min_score: 0.2        # weakest detection kept (below 0.5 it can only extend an existing track)
    threshold: 0.6        # median score an object needs to become an event
    min_frames: 3         # ...seen on at least this many frames
    # thresholds: {dog: 0.5, person: 0.65}   # per-object overrides of threshold
    motion_sensitivity: normal   # very_low (rain, trees) | low | normal | high (small, far movement)
    zoom: true            # closer look at small moving things (finds far-away people; extra CPU then)
    motion_gate: true     # new objects must appear where something moved (ignores look-alikes)
    night_boost: 0.1      # in infrared footage, events and alerts need this much more score
    label_vote: true      # a person/dog mix-up becomes one object with the majority label
  alert:
    labels: [person]      # which objects alert
    zones: []             # if set, the object must enter one of these zones
    cooldown_seconds: 60  # no repeat alert for the same camera + object within this
    schedule: []          # empty = any time. e.g. only at night:
    #   - {days: [mon, tue, wed, thu, fri, sat, sun], start: "22:00", end: "06:30"}

storage:
  retention_days: 30      # delete 24/7 recordings older than this
  max_usage_percent: 90   # if the disk passes this, delete oldest first
  event_retention_days: 30  # events keep their own clip, snapshot and alert picture this long

# Camera ids: lowercase letters, digits, underscores (e.g. front_door).
# Annke cameras are Hikvision-based. The usual RTSP paths are:
#   main stream: /Streaming/Channels/101
#   substream:   /Streaming/Channels/102
# Some older Annke firmware uses /H264/ch1/main/av_stream and /H264/ch1/sub/av_stream.
cameras:
  front_door:
    name: Front Door
    streams:
      main: rtsp://${CAM_USER}:${CAM_PASSWORD}@192.168.1.101:554/Streaming/Channels/101
      sub: rtsp://${CAM_USER}:${CAM_PASSWORD}@192.168.1.101:554/Streaming/Channels/102

  driveway:
    name: Driveway
    streams:
      main: rtsp://${CAM_USER}:${CAM_PASSWORD}@192.168.1.102:554/Streaming/Channels/101
      sub: rtsp://${CAM_USER}:${CAM_PASSWORD}@192.168.1.102:554/Streaming/Channels/102
    record:
      retention_days: 60  # example per-camera override
    # Zones and masks use fractions of the frame (0..1). Easiest way to make them: the
    # "Zones & masks" button in the debug viewer (http://localhost:5050), which writes this for you.
    zones:
      driveway:
        points: [[0.2, 0.45], [0.8, 0.45], [1.0, 1.0], [0.0, 1.0]]
        objects: [person, car]   # optional: only these objects count in this zone
    masks:
      motion:                    # ignore movement here (trees, the camera's timestamp)
        - [[0.0, 0.0], [0.4, 0.0], [0.4, 0.06], [0.0, 0.06]]
      objects: []                # drop detections whose ground point is in here
    alert:
      labels: [person, car]
      zones: [driveway]          # only alert once something enters the driveway zone

  # A public live feed (HLS) also works, e.g. a state DOT traffic camera. Find current
  # URLs on your state's 511 site; they change. Prefix with ffmpeg: and add #video=copy.
  # traffic_cam:
  #   name: I-20 Traffic
  #   streams:
  #     main: ffmpeg:https://ITSStreamingBR2.dotd.la.gov/public/shr-cam-030.streams/playlist.m3u8#video=copy

