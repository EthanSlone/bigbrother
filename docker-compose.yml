name: bigbrother

# Every service keeps at most 3 x 10 MB of logs (Docker keeps them forever otherwise).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Stack: stream hub, event bus, recorder, detector, alerter (+ optional fake cameras).
# First run:   docker compose run --rm tools configure
# Then:        docker compose up -d --build

services:
  go2rtc:
    logging: *logging
    image: alexxit/go2rtc:1.9.14
    restart: unless-stopped
    env_file: .env            # go2rtc expands ${CAM_PASSWORD} etc. itself
    volumes:
      - ./config/generated:/config
    ports:
      # Local-only for testing (web UI + RTSP for VLC). Never forward these.
      - "127.0.0.1:1984:1984"
      - "127.0.0.1:8554:8554"

  mosquitto:
    logging: *logging
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    # No ports published: internal bus only for now.

  recorder:
    logging: *logging
    build: .
    image: bigbrother:dev
    command: ["recorder"]
    restart: unless-stopped
    environment:
      BB_LOG_LEVEL: ${BB_LOG_LEVEL:-INFO}
    volumes:
      - ./config:/config:ro
      - ${RECORDINGS_PATH:-recordings}:/recordings
      - data:/data
    depends_on: [go2rtc, mosquitto]
    stop_grace_period: 30s    # time for ffmpeg to close its last segment

  detector:
    logging: *logging
    build: .
    image: bigbrother:dev
    command: ["detector"]
    restart: unless-stopped
    environment:
      BB_LOG_LEVEL: ${BB_LOG_LEVEL:-INFO}
    volumes:
      - ./config:/config:ro
      - data:/data            # events database + snapshots (shared with the recorder)
      - models:/models        # downloaded detection models
      - ${RECORDINGS_PATH:-recordings}:/recordings:ro   # for playback in the viewer
    ports:
      - "127.0.0.1:5050:5050" # debug viewer, local only
    depends_on: [go2rtc, mosquitto]
    stop_grace_period: 15s

  alerter:
    logging: *logging
    build: .
    image: bigbrother:dev
    command: ["alerter"]
    restart: unless-stopped
    env_file: .env            # PUSHOVER_USER / PUSHOVER_TOKEN
    environment:
      BB_LOG_LEVEL: ${BB_LOG_LEVEL:-INFO}
    volumes:
      - ./config:/config:ro
      - data:/data
      - models:/models
      - ${RECORDINGS_PATH:-recordings}:/recordings:ro   # disk-space check for health alerts
    depends_on: [go2rtc, mosquitto, detector]

  # The app: login, live view, events, recordings, settings. The one service meant to be
  # reached from outside, through your reverse proxy. First start prints a setup code:
  #   docker compose logs web
  web:
    logging: *logging
    build: .
    image: bigbrother:dev
    command: ["web"]
    restart: unless-stopped
    environment:
      BB_LOG_LEVEL: ${BB_LOG_LEVEL:-INFO}
      # IP(s) of your reverse proxy, so login rate limiting sees real client addresses
      # and cookies are marked secure behind HTTPS. Comma-separated; CIDR allowed.
      BB_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ./config:/config        # read-write: settings edited in the app are saved here
      - data:/data
      - ${RECORDINGS_PATH:-recordings}:/recordings:ro
    ports:
      - "${WEB_PORT:-8090}:8090"
    depends_on: [go2rtc, mosquitto]

  # One-off commands: `docker compose run --rm tools configure|probe|fakecam|evaluate|test-alert`
  tools:
    logging: *logging
    build: .
    image: bigbrother:dev
    profiles: ["tools"]
    env_file: .env
    volumes:
      - ./config:/config
      - ./testdata:/testdata:ro
      - models:/models

  # Fake cameras for testing without real ones: loops clips from testdata/ as
  # password-protected RTSP cameras. Start with `docker compose --profile fakecam up -d`.
  fakecam:
    logging: *logging
    image: alexxit/go2rtc:1.9.14
    profiles: ["fakecam"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config/generated/fakecam:/config
      - ./testdata:/testdata:ro
    ports:
      - "127.0.0.1:1985:1984"   # fake cameras' web UI, for checking clips play

volumes:
  recordings:
  data:
  models:
  mqtt-data:
